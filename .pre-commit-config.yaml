repos:
  - repo: local
    hooks:
      - id: flake8
        name: Flake8 (all Python files)
        entry: python -m flake8 .
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: Pyright (src, standard)
        entry: python -m pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: Tests with branch coverage
        entry: python -m coverage run -m pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: docker-smoke
        name: Docker Compose build and HTTP smoke test
        entry: python -m coverage run --append -m pytest tests/test_docker_smoke.py --run-docker -q
        language: system
        pass_filenames: false
        files: '^(Dockerfile|compose\.yaml|\.dockerignore|\.pre-commit-config\.yaml|\.github/workflows/.*|requirements.*\.txt|pyproject\.toml|src/.*\.py|dashboard/.*\.py|tests/(helpers|conftest|test_docker_smoke)\.py)$'
      - id: source-coverage
        name: Source coverage >= 95%
        entry: python -m coverage report --include=src/* --fail-under=95
        language: system
        pass_filenames: false
        always_run: true
      - id: test-coverage
        name: Test code coverage >= 95%
        entry: python -m coverage report --include=tests/* --fail-under=95
        language: system
        pass_filenames: false
        always_run: true
